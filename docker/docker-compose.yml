version: '3.9'

services:

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: uz_eu_web
    networks:
      - shared_network
    command: >
      /bin/sh -c "python manage.py collectstatic --noinput &&
                  python manage.py migrate &&
                  gunicorn --reload --workers ${WORKERS_COUNT:-4} --bind 0.0.0.0:8000 config.wsgi:application"
    volumes:
      - ./../src:/app/src
      - ./../static:/app/static
      - ./../media:/app/media
      - ./../logs:/app/logs
      - ./../assets:/app/assets
    ports:
      - "8080:8000"
    env_file:
      - ./../.envs/.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.0
    container_name: uz_eu_db
    env_file:
      - ./../.envs/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./.volumes/pgdata:/var/lib/postgresql/data
    ports:
      - "5439:5432"
    networks:
      - shared_network
    # -h localhost: during first-run initdb the image's temporary server listens on the socket only, so it isn't "ready".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: uz_eu_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - shared_network
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./.volumes/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: uz_eu_celery
    networks:
      - shared_network
    command: celery -A config worker --loglevel=INFO --concurrency=${CELERY_WORKERS:-2}
    volumes:
      - ./../src:/app/src
      - ./../media:/app/media
      - ./../logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ./../.envs/.env
    restart: unless-stopped

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: uz_eu_celery_beat
    networks:
      - shared_network
    # DatabaseScheduler reads django_celery_beat tables, which `web` creates on `migrate`; restart until they exist.
    # Empty --pidfile: a stale celerybeat.pid in the bind-mounted src/ would otherwise block restarts.
    command: >
      celery -A config beat --loglevel=INFO --pidfile=
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./../src:/app/src
      - ./../logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    env_file:
      - ./../.envs/.env
    restart: unless-stopped

